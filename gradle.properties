org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# No AndroidX, no Compose, no third-party PDF engine. The whole app is the platform
# framework plus the Kotlin stdlib, and R8 strips most of the stdlib back out again.
android.nonTransitiveRClass=true
